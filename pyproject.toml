[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "syncbridge"
version = "0.1.0"
description = "Bidirectional Salesforce-Slack integration on AWS Lambda with Okta SAML SSO and SCIM provisioning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "signxml>=4.0",
    "cryptography>=43",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["boto3>=1.35", "moto[dynamodb,sqs]>=5", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "cfn-lint>=1.0", "pyyaml>=6"]

[project.scripts]
syncbridge = "syncbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
syncbridge = ["static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
