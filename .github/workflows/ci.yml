name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Tests (sync engine, SAML, SCIM, console API, DynamoDB/SQS/KMS via moto)
        run: pytest -q --cov=syncbridge --cov-report=term
      - name: CloudFormation lint
        run: cfn-lint infra/template.yaml

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  failure-test:
    # 10,000 Cases through the real pipeline with faults on every layer. Fails on any
    # duplicate write, missing record or mismatch between Salesforce and Slack.
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: syncbridge chaos --cases 10000 --seed 7 --baseline --strict --out ci-reports
      - name: Publish report
        if: always()
        run: cat ci-reports/chaos_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-test-report
          path: ci-reports/

  lambda-package:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make lambda PY=python
      - name: Check package size (Lambda limit is 250 MB unzipped)
        run: du -sm build/lambda | awk '{ if ($1 > 200) { print "package too large: " $1 " MB"; exit 1 } else print $1 " MB" }'
