<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SyncBridge architecture</title>
  <desc>Salesforce and Slack send signed webhooks through CloudFront and API Gateway to Lambda functions in the customer's AWS account. Events queue in SQS; a worker Lambda writes to Salesforce and Slack exactly once using idempotency records in DynamoDB. Okta signs admins in with SAML and provisions them with SCIM.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1F6F5C"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5D6A76"/>
    </marker>
    <style>
      .ext { fill: #1B2430; }
      .ext-t { fill: #FFFFFF; font-size: 19px; font-weight: 700; }
      .ext-s { fill: #C9D4CF; font-size: 13px; }
      .box { fill: #FFFFFF; stroke: #C5CDC7; stroke-width: 1.2; }
      .fn { fill: #E3F1EC; stroke: #1F6F5C; stroke-width: 1.2; }
      .q { fill: #F8EFDC; stroke: #B7791F; stroke-width: 1.2; }
      .t { fill: #1B2430; font-size: 14px; font-weight: 650; }
      .s { fill: #5D6A76; font-size: 12px; }
      .flow { stroke: #1F6F5C; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .flow2 { stroke: #5D6A76; stroke-width: 1.4; fill: none; marker-end: url(#g); stroke-dasharray: 4 3; }
      .lbl { fill: #1F6F5C; font-size: 11.5px; font-weight: 600; }
      .lblg { fill: #5D6A76; font-size: 11.5px; }
    </style>
  </defs>
  <rect width="1200" height="730" fill="#F2F4F1"/>

  <!-- admin -->
  <rect x="470" y="18" width="260" height="52" rx="10" class="box"/>
  <text x="600" y="40" text-anchor="middle" class="t">Admins and operators</text>
  <text x="600" y="58" text-anchor="middle" class="s">Browser, signed in through Okta</text>
  <path d="M600 70 V136" class="flow"/>

  <!-- external systems -->
  <rect x="20" y="140" width="230" height="150" rx="12" class="ext"/>
  <text x="40" y="172" class="ext-t">Okta</text>
  <text x="40" y="200" class="ext-s">SAML 2.0 sign-in to the console</text>
  <text x="40" y="230" class="ext-s">SCIM 2.0: users, deactivation,</text>
  <text x="40" y="247" class="ext-s">groups that become roles</text>

  <rect x="20" y="400" width="230" height="180" rx="12" class="ext"/>
  <text x="40" y="432" class="ext-t">Salesforce</text>
  <text x="40" y="460" class="ext-s">Case trigger sends signed,</text>
  <text x="40" y="477" class="ext-s">batched change notifications</text>
  <text x="40" y="508" class="ext-s">REST API, OAuth 2.0 + PKCE,</text>
  <text x="40" y="525" class="ext-s">least-privilege integration user</text>
  <text x="40" y="556" class="ext-s">Case_Message__c external ID</text>

  <rect x="950" y="150" width="230" height="180" rx="12" class="ext"/>
  <text x="970" y="182" class="ext-t">Slack</text>
  <text x="970" y="210" class="ext-s">Events API: thread replies</text>
  <text x="970" y="227" class="ext-s">Interactivity: Case buttons</text>
  <text x="970" y="258" class="ext-s">Web API, OAuth v2 bot token</text>
  <text x="970" y="275" class="ext-s">One message per Case, with</text>
  <text x="970" y="292" class="ext-s">metadata naming the record</text>

  <!-- AWS account -->
  <rect x="290" y="108" width="620" height="604" rx="16" fill="none" stroke="#1B2430" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="310" y="702" class="s" font-weight="600">Your AWS account, one deployment per customer</text>

  <rect x="320" y="138" width="560" height="44" rx="8" class="box"/>
  <text x="340" y="165" class="t">CloudFront</text>
  <text x="430" y="165" class="s">one HTTPS domain: console from S3, everything else to the API</text>

  <rect x="320" y="206" width="560" height="44" rx="8" class="box"/>
  <text x="340" y="233" class="t">API Gateway</text>
  <text x="446" y="233" class="s">HTTP API, throttled, access logs</text>
  <path d="M600 182 V202" class="flow"/>

  <path d="M250 152 H316" class="flow"/>
  <path d="M250 420 H272 V172 H316" class="flow"/>
  <path d="M950 162 H884" class="flow"/>

  <rect x="320" y="282" width="170" height="64" rx="8" class="fn"/>
  <text x="336" y="307" class="t">webhooks</text>
  <text x="336" y="326" class="s">verify signature,</text>
  <text x="336" y="340" class="s">enqueue, answer 202</text>
  <rect x="515" y="282" width="170" height="64" rx="8" class="fn"/>
  <text x="531" y="307" class="t">api</text>
  <text x="531" y="326" class="s">console, SAML ACS,</text>
  <text x="531" y="340" class="s">OAuth connections</text>
  <rect x="710" y="282" width="170" height="64" rx="8" class="fn"/>
  <text x="726" y="307" class="t">scim</text>
  <text x="726" y="326" class="s">Users and Groups,</text>
  <text x="726" y="340" class="s">bearer token</text>
  <path d="M405 250 V278" class="flow"/>
  <path d="M600 250 V278" class="flow"/>
  <path d="M795 250 V278" class="flow"/>

  <rect x="320" y="392" width="170" height="54" rx="8" class="q"/>
  <text x="336" y="416" class="t">SQS queue</text>
  <text x="336" y="434" class="s">at-least-once, then DLQ</text>
  <path d="M405 346 V388" class="flow"/>

  <rect x="320" y="476" width="170" height="64" rx="8" class="fn"/>
  <text x="336" y="501" class="t">worker</text>
  <text x="336" y="520" class="s">idempotent writes,</text>
  <text x="336" y="534" class="s">retries, circuit breaker</text>
  <path d="M405 446 V472" class="flow"/>

  <rect x="320" y="570" width="170" height="64" rx="8" class="fn"/>
  <text x="336" y="595" class="t">reconcile</text>
  <text x="336" y="614" class="s">every 5 min: finds</text>
  <text x="336" y="628" class="s">missed webhooks</text>
  <path d="M320 602 H304 V419 H316" class="flow2"/>

  <rect x="560" y="392" width="320" height="150" rx="8" class="box"/>
  <text x="580" y="418" class="t">DynamoDB</text>
  <text x="580" y="442" class="s">Idempotency keys and record locks</text>
  <text x="580" y="462" class="s">Slack message per record (PENDING, ACTIVE)</text>
  <text x="580" y="482" class="s">OAuth tokens, envelope-encrypted</text>
  <text x="580" y="502" class="s">SCIM users, groups, sessions</text>
  <text x="580" y="522" class="s">Audit log (1 year), dead letters</text>
  <path d="M600 346 V388" class="flow2"/>
  <path d="M795 346 V388" class="flow2"/>
  <path d="M490 498 H556" class="flow2"/>

  <rect x="560" y="570" width="320" height="64" rx="8" class="box"/>
  <text x="580" y="595" class="t">KMS and Secrets Manager</text>
  <text x="580" y="614" class="s">customer-managed key, rotated yearly;</text>
  <text x="580" y="628" class="s">client and signing secrets</text>

  <!-- worker to the two APIs -->
  <path d="M320 516 H254" class="flow"/>
  <text x="40" y="604" class="lbl">writes: upsert by external ID, PATCH</text>
  <path d="M490 520 H530 V662 H930 V300 H954" class="flow"/>
  <text x="560" y="656" class="lbl">post once (metadata recovery), update in place</text>

</svg>
